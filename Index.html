<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAZIB>STUDIO PRO 🎧</title>
    <!-- Fragmented Firebase Library Load -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --accent: #00d4ff; --bg: #0a0e14; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 5px; overflow-x: hidden; box-sizing: border-box; }
        
        #off-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0e14; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; text-align: center; }
        #off-screen h2 { color: #ff4d4d; font-size: 22px; margin-bottom: 8px; font-weight: bold; }
        #off-screen p { color: #8899a6; font-size: 14px; max-width: 80%; margin-bottom: 15px; }
        .admin-link { color: var(--accent); text-decoration: none; font-weight: bold; font-size: 13px; border: 1px solid var(--accent); padding: 8px 15px; border-radius: 6px; transition: 0.3s; }

        .studio-container { 
            background: #151b26; padding: 10px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            width: 100%; max-width: 450px; border: 1px solid #232d3d; text-align: center; position: relative;
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start;
        }
        
        /* Notice Bar Styling */
        .notice-wrap {
            width: 100%; overflow: hidden; background: rgba(0,0,0,0.2); border-radius: 10px; margin-bottom: 5px; display: none;
        }
        .notice-marquee {
            white-space: nowrap; display: inline-block; padding-left: 100%; animation: scroll-left 15s linear infinite; color: #ffeb3b; font-size: 12px; font-weight: bold;
        }
        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        h1 { 
            width: 100%; font-size: 18px; letter-spacing: 2px; margin: 0 0 10px 0; border-bottom: 1px solid #232d3d; padding-bottom: 5px; font-weight: 900;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 400% 400%; animation: rgb-move 5s linear infinite;
            display: flex; align-items: center; justify-content: center; min-height: 40px;
        }

        .sazib-logo {
            width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent); margin-right: 10px; box-shadow: 0 0 10px var(--accent); object-fit: cover;
        }

        .contact-logo {
            width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent); margin-left: 10px; box-shadow: 0 0 10px var(--accent); object-fit: cover; transition: 0.3s;
        }
        .contact-logo:hover { transform: scale(1.1); }

        @keyframes rgb-move { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .file-box { 
            width: 100%; background: #1c2431; padding: 4px 6px; border-radius: 8px; margin-bottom: 6px; border: 1px dashed #3d4b5f; text-align: left; box-sizing: border-box; 
        }
        .file-box label { font-size: 9px; color: var(--accent); display: block; margin-bottom: 2px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .control-panel { 
            width: 49%; background: #1c2431; padding: 6px 8px; border-radius: 10px; margin-bottom: 6px; border: 1px solid #2b3648; text-align: left; box-sizing: border-box; 
        }
        .full-width { width: 100%; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #8899a6; margin-bottom: 4px; font-weight: 500; }
        span.val { color: #fff; font-weight: bold; }

        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; height: 3px; margin: 2px 0; }
        input[type="file"] { font-size: 9px; color: #fff; width: 100%; outline: none; }
        select { background: #0a0e14; color: #fff; border: 1px solid var(--accent); font-size: 10px; border-radius: 4px; width: 100%; padding: 2px; cursor: pointer; }

        .btn-render { width: 100%; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; margin-top: 5px; }
        .btn-render:active { transform: scale(0.98); }
        .btn-render:disabled { background: #333; color: #666; cursor: not-allowed; }
        
        #videoPreview, #audioPlayer { width: 100%; border-radius: 12px; margin-top: 10px; display: none; border: 1px solid var(--accent); max-height: 120px; }
        .status { width: 100%; margin-top: 5px; font-size: 10px; color: #8899a6; min-height: 14px; line-height: 1.2; }
        .download-link { width: 100%; display: none; margin-top: 8px; color: var(--accent); text-decoration: none; border: 1px solid var(--accent); padding: 10px; border-radius: 8px; font-size: 12px; text-align: center; font-weight: bold; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="off-screen">
    <h2>SYSTEM OFFLINE 🔒</h2>
    <p>This service has been temporarily disabled. Please check back later.</p>
    <a href="https://www.facebook.com/share/1CmhTyBsQb/" class="admin-link">Admin Contact 💬</a>
</div>

<div class="studio-container" id="app-body">
    <!-- Notice Bar Area -->
    <div class="notice-wrap" id="notice-box">
        <div class="notice-marquee" id="remote-notice"></div>
    </div>

    <h1 id="dyn-title">
        <img src="https://d.top4top.io/p_3744hq3y40.png" class="sazib-logo">
        <span id="title-text">DEVELOPER SAZIB</span>
        <a href="https://www.facebook.com/share/1CmhTyBsQb/" target="_blank">
            <img src="https://h.top4top.io/p_37835tlia0.png" class="contact-logo">
        </a>
    </h1>
    
    <div class="file-box">
        <label>১. ইডিট করার জন্য অডিও ফাইল (Audio) *</label>
        <input type="file" id="audioInput" accept="audio/*">
    </div>

    <div class="file-box">
        <label>২. Aᴜᴅɪᴏ টি Sᴀᴠᴇ হবে ফটো অথবা ভিডিও (Optional)</label>
        <input type="file" id="imageInput" accept="image/*,video/*">
    </div>

    <div class="file-box">
        <label>৩. ব্যাকগ্রাউন্ড মিউজিক (Optional)</label>
        <input type="file" id="bgmInput" accept="audio/*">
    </div>

    <div class="control-panel">
        <label>𝐕𝐨𝐜𝐚𝐥 𝐂𝐥𝐚𝐫𝐢𝐭𝐲 <span class="val" id="clarityVal">10%</span></label>
        <input type="range" id="claritySlider" min="0" max="100" value="10">
    </div>

    <div class="control-panel">
        <label>𝗡𝗼𝗶𝘀𝗲 𝗥𝗲𝗺𝗼𝐯𝗲 <span class="val" id="noiseVal">20%</span></label>
        <input type="range" id="noiseSlider" min="0" max="100" value="20">
    </div>

    <div class="control-panel">
        <label>𝐀𝐮𝐝𝐢𝐨 𝐒𝐩𝐞𝐞𝐝 <span class="val" id="speedVal">1.0x</span></label>
        <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="control-panel">
        <label>𝐕𝐨𝐢𝐜𝐞 𝐂𝐡𝐚𝐧𝐠𝐞 <span class="val" id="pitchVal">Normal</span></label>
        <input type="range" id="pitchSlider" min="-5" max="5" step="1" value="0">
    </div>

    <div class="control-panel">
        <label>𝗥𝗲𝘃ε𝗿𝗯 𝐏𝐫ε𝐬ε𝐭</label>
        <select id="reverbPreset">
            <option value="none">None</option>
            <option value="studio">Small Room</option>
            <option value="hall">Large Hall</option>
            <option value="cave">Cave Echo</option>
        </select>
    </div>
    <div class="control-panel">
        <label>𝐁𝐚𝐜𝐤𝐠𝐫𝐨𝐮𝐧ｄ 𝐕𝐨𝐥 <span class="val" id="bgmVolVal">30%</span></label>
        <input type="range" id="bgmVolSlider" min="0" max="100" value="30">
    </div>

    <div class="control-panel" style="border-left: 2px solid #ff00ff; background: #1e1b2e;">
        <label>𝐌𝐢𝐜 𝐄𝐜𝐡𝐨 <span class="val" id="micEchoVal">0%</span></label>
        <input type="range" id="micEchoSlider" min="0" max="100" value="0">
    </div>

    <div class="control-panel full-width" style="background: #1a2433; margin-bottom: 2px;">
        <label>𝐄𝐜𝐡𝐨 𝐐𝐮𝐚/𝐒𝐭𝐫 <span class="val" id="qtyVal">40</span> / <span class="val" id="strVal">50</span></label>
        <input type="range" id="qtySlider" min="0" max="100" value="40">
        <input type="range" id="strSlider" min="0" max="100" value="50" style="margin-top: 4px;">
    </div>

    <div class="status" id="status">ফাইল সিলেক্ট করে বাটন চাপুন</div>
    <button id="processBtn" class="btn-render">Apply Effects ⚡</button>
    
    <video id="videoPreview" controls></video>
    <audio id="audioPlayer" controls></audio>
    <a id="downloadBtn" class="download-link">Download Now ⬇️</a>
</div>

<canvas id="renderCanvas" style="display:none;"></canvas>

<script>
    const _c_data = {
        apiKey: "AIzaSyD8unxeSXs5078SpnCYn2Mh8EwgCseo7Mk",
        authDomain: "audio-edit-b3a0a.firebaseapp.com",
        databaseURL: "https://audio-edit-b3a0a-default-rtdb.firebaseio.com",
        projectId: "audio-edit-b3a0a",
        storageBucket: "audio-edit-b3a0a.firebasestorage.app",
        messagingSenderId: "280325275294",
        appId: "1:280325275294:web:149c9d77a60ad0785b058f"
    };

    firebase.initializeApp(_c_data);
    const _r_db = firebase.database();
    let _active_wm = "Sazib";

    (function _init_remote() {
        _r_db.ref('app_config').on('value', (_s) => {
            const _v = _s.val();
            if (_v) {
                if (_v.header_name) {
                    document.getElementById('title-text').innerText = _v.header_name;
                }
                if (_v.notice) {
                    document.getElementById('notice-box').style.display = 'block';
                    document.getElementById('remote-notice').innerText = _v.notice;
                } else {
                    document.getElementById('notice-box').style.display = 'none';
                }
                if (_v.watermark) _active_wm = _v.watermark;
                if (_v.app_status === "off") { document.getElementById('off-screen').style.display = 'flex'; document.getElementById('app-body').style.display = 'none'; } 
                else { document.getElementById('off-screen').style.display = 'none'; document.getElementById('app-body').style.display = 'flex'; }
            }
        });
    })();

    const audioInput = document.getElementById('audioInput');
    const imageInput = document.getElementById('imageInput');
    const bgmInput = document.getElementById('bgmInput');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const videoPreview = document.getElementById('videoPreview');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('renderCanvas');
    const reverbPreset = document.getElementById('reverbPreset');

    const updateVal = (id, val, suffix="") => document.getElementById(id).innerText = val + suffix;
    document.getElementById('claritySlider').oninput = e => updateVal('clarityVal', e.target.value, "%");
    document.getElementById('noiseSlider').oninput = e => updateVal('noiseVal', e.target.value, "%");
    document.getElementById('speedSlider').oninput = e => updateVal('speedVal', e.target.value, "x");
    document.getElementById('bgmVolSlider').oninput = e => updateVal('bgmVolVal', e.target.value, "%");
    document.getElementById('micEchoSlider').oninput = e => updateVal('micEchoVal', e.target.value, "%");
    document.getElementById('qtySlider').oninput = e => updateVal('qtyVal', e.target.value);
    document.getElementById('strSlider').oninput = e => updateVal('strVal', e.target.value);
    document.getElementById('pitchSlider').oninput = e => { let v = e.target.value; updateVal('pitchVal', v == 0 ? "Normal" : (v > 0 ? "Sharp" : "Deep")); };

    function _createReverb(ctx, type) {
        const sr = ctx.sampleRate, dur = type === 'studio' ? 0.8 : (type === 'hall' ? 2.5 : 4.0);
        const len = sr * dur, buf = ctx.createBuffer(2, len, sr);
        for (let i = 0; i < 2; i++) { let d = buf.getChannelData(i); for (let j = 0; j < len; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / len, 1.5); }
        return buf;
    }

    processBtn.onclick = async () => {
        if (!audioInput.files[0]) return alert("অডিও ফাইল সিলেক্ট করুন!");
        processBtn.disabled = true;
        videoPreview.style.display = 'none'; audioPlayer.style.display = 'none'; downloadBtn.style.display = 'none';
        status.innerText = "HQ অডিও প্রসেস হচ্ছে... 🎧";

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const mainRaw = await audioInput.files[0].arrayBuffer();
        const decodedMain = await audioCtx.decodeAudioData(mainRaw);

        let decodedBGM = null;
        if (bgmInput.files[0]) { const bRaw = await bgmInput.files[0].arrayBuffer(); decodedBGM = await audioCtx.decodeAudioData(bRaw); }

        const speed = parseFloat(document.getElementById('speedSlider').value);
        const bgmVol = parseFloat(document.getElementById('bgmVolSlider').value) / 100;
        const offlineCtx = new OfflineAudioContext(2, Math.ceil(decodedMain.length / speed) + (decodedMain.sampleRate * 2), decodedMain.sampleRate);

        const source = offlineCtx.createBufferSource();
        source.buffer = decodedMain;
        source.playbackRate.value = speed;
        source.detune.value = document.getElementById('pitchSlider').value * 100;

        const compressor = offlineCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-24, offlineCtx.currentTime);
        const noise = offlineCtx.createBiquadFilter();
        noise.type = "lowpass"; noise.frequency.value = 20000 - (document.getElementById('noiseSlider').value * 180);
        const clarity = offlineCtx.createBiquadFilter();
        clarity.type = "highshelf"; clarity.frequency.value = 4500; clarity.gain.value = (document.getElementById('claritySlider').value / 100) * 12;

        const micDelay = offlineCtx.createDelay(); micDelay.delayTime.value = 0.05;
        const micWet = offlineCtx.createGain(); micWet.gain.value = (document.getElementById('micEchoSlider').value / 100) * 0.5;

        const echoDelay = offlineCtx.createDelay(); echoDelay.delayTime.value = 0.35;
        const echoFeedback = offlineCtx.createGain(); echoFeedback.gain.value = (document.getElementById('qtySlider').value / 100) * 0.75;
        const echoWet = offlineCtx.createGain(); echoWet.gain.value = (document.getElementById('strSlider').value / 100);

        source.connect(compressor); compressor.connect(noise); noise.connect(clarity);
        clarity.connect(offlineCtx.destination);
        clarity.connect(micDelay); micDelay.connect(micWet); micWet.connect(offlineCtx.destination);
        clarity.connect(echoDelay); echoDelay.connect(echoFeedback); echoFeedback.connect(echoDelay); 
        echoDelay.connect(echoWet); echoWet.connect(offlineCtx.destination);

        if (reverbPreset.value !== 'none') {
            const con = offlineCtx.createConvolver(); con.buffer = _createReverb(offlineCtx, reverbPreset.value);
            const rMix = offlineCtx.createGain(); rMix.gain.value = 0.3;
            clarity.connect(con); con.connect(rMix); rMix.connect(offlineCtx.destination);
        }

        if (decodedBGM) {
            const bgmSrc = offlineCtx.createBufferSource(); bgmSrc.buffer = decodedBGM; bgmSrc.loop = true;
            const bgGain = offlineCtx.createGain(); bgGain.gain.value = bgmVol;
            const splitter = offlineCtx.createChannelSplitter(2); const merger = offlineCtx.createChannelMerger(2); const inverter = offlineCtx.createGain(); inverter.gain.value = -1;
            bgmSrc.connect(splitter); splitter.connect(merger, 0, 0); splitter.connect(inverter, 1); inverter.connect(merger, 0, 1);
            merger.connect(bgGain); bgGain.connect(offlineCtx.destination); bgmSrc.start(0);
        }

        source.start();
        const processedBuffer = await offlineCtx.startRendering();

        if (imageInput.files[0]) {
            const file = imageInput.files[0]; const isVideo = file.type.startsWith('video/');
            let timeLeft = Math.ceil(processedBuffer.duration);
            status.innerText = `ভিডিও জেনারেট হচ্ছে... ${timeLeft} সেকেন্ড বাকি 🎥`;
            
            const countdownInterval = setInterval(() => { timeLeft--; if (timeLeft >= 0) status.innerText = `ভিডিও জেনারেট হচ্ছে... ${timeLeft} সেকেন্ড বাকি 🎥`; else clearInterval(countdownInterval); }, 1000);

            canvas.width = 720; canvas.height = 1280; const ctx = canvas.getContext('2d');
            let bgSource;
            if (isVideo) { bgSource = document.createElement('video'); bgSource.src = URL.createObjectURL(file); bgSource.muted = true; bgSource.loop = true; await bgSource.play(); } 
            else { bgSource = new Image(); bgSource.src = URL.createObjectURL(file); await new Promise(r => bgSource.onload = r); }

            const stream = canvas.captureStream(30); 
            const audioDest = audioCtx.createMediaStreamDestination();
            const bufferSource = audioCtx.createBufferSource();
            bufferSource.buffer = processedBuffer; bufferSource.connect(audioDest);
            const combinedStream = new MediaStream([stream.getVideoTracks()[0], audioDest.stream.getAudioTracks()[0]]);
            const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm;codecs=vp8,opus', audioBitsPerSecond: 256000, videoBitsPerSecond: 5000000 });
            const chunks = []; recorder.ondataavailable = e => chunks.push(e.data);
            
            let isRec = true;
            function renderLoop() {
                if (!isRec) return;
                let scale = Math.max(canvas.width / (isVideo?bgSource.videoWidth:bgSource.width), canvas.height / (isVideo?bgSource.videoHeight:bgSource.height));
                ctx.drawImage(bgSource, (canvas.width - (isVideo?bgSource.videoWidth:bgSource.width)*scale)/2, (canvas.height - (isVideo?bgSource.videoHeight:bgSource.height)*scale)/2, (isVideo?bgSource.videoWidth:bgSource.width)*scale, (isVideo?bgSource.videoHeight:bgSource.height)*scale);
                ctx.fillStyle = "rgba(255, 255, 255, 0.6)"; ctx.font = "bold 24px Segoe UI"; ctx.textAlign = "center";
                ctx.fillText(_active_wm, canvas.width / 2, canvas.height - 170);
                requestAnimationFrame(renderLoop);
            }
            recorder.onstop = () => { isRec = false; clearInterval(countdownInterval); const blob = new Blob(chunks, { type: 'video/mp4' }); const url = URL.createObjectURL(blob); videoPreview.src = url; videoPreview.style.display = 'block'; downloadBtn.href = url; downloadBtn.style.display = 'block'; downloadBtn.download = "Studio_Pro_Video.mp4"; status.innerText = "ভিডিও সফলভাবে তৈরি হয়েছে! ✅"; processBtn.disabled = false; };
            recorder.start(); bufferSource.start(); renderLoop();
            setTimeout(() => { if(recorder.state === "recording") recorder.stop(); }, (processedBuffer.duration * 1000) + 300);
        } else {
            status.innerText = "অডিও সফলভাবে তৈরি হয়েছে! ✅";
            const wavBlob = bufferToWav(processedBuffer); const url = URL.createObjectURL(wavBlob);
            audioPlayer.src = url; audioPlayer.style.display = 'block'; downloadBtn.href = url; downloadBtn.style.display = 'block'; downloadBtn.download = "Studio_Pro_Audio.wav"; processBtn.disabled = false;
        }
    };

    function bufferToWav(abuffer) {
        let numOfChan = abuffer.numberOfChannels, length = abuffer.length * numOfChan * 2 + 44, buffer = new ArrayBuffer(length), view = new DataView(buffer), channels = [], i, sample, offset = 0, pos = 0;
        function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
        setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
        setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
        setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);
        for(i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));
        while(pos < length) { for(i = 0; i < numOfChan; i++) { sample = Math.max(-1, Math.min(1, channels[i][offset])); sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF) | 0; view.setInt16(pos, sample, true); pos += 2; } offset++; }
        return new Blob([buffer], {type: "audio/wav"});
    }
</script>
</body>
</html>
