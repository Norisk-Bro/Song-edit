<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Noise Reducer Pro</title>
    <!-- WaveSurfer UI -->
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <!-- RNNoise AI Library -->
    <script src="https://cdn.jsdelivr.net/npm/rnnoise-wasm@1.0.2/dist/rnnoise.js"></script>
    <style>
        body { font-family: sans-serif; background: #0d0d0d; color: white; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background: #1a1a1a; padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        h2 { color: #ff8c00; margin-bottom: 20px; }
        #waveform { background: #222; border-radius: 12px; height: 100px; margin: 20px 0; border: 1px solid #333; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        button { padding: 14px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .play-btn { background: #007bff; color: white; }
        .ai-btn { background: #28a745; color: white; }
        .dl-btn { background: #ff8c00; color: white; }
        button:disabled { opacity: 0.3; }
        #status { font-size: 13px; color: #ff8c00; margin-top: 15px; line-height: 1.5; }
        input[type="file"] { margin-bottom: 10px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h2>Noise Reducer AI</h2>
    <input type="file" id="audio-input" accept="audio/*,video/*">
    <div id="waveform"></div>
    <div class="controls">
        <button class="play-btn" id="play-btn" disabled>Play / Pause</button>
        <button class="ai-btn" id="ai-btn" disabled>Apply AI Noise Removal</button>
        <button class="dl-btn" id="dl-btn" disabled>Download Audio</button>
    </div>
    <p id="status">Upload a small file to test</p>
</div>

<script>
    let wavesurfer, originalBuffer, currentUrl;
    const aiBtn = document.getElementById('ai-btn'), dlBtn = document.getElementById('dl-btn'), playBtn = document.getElementById('play-btn'), status = document.getElementById('status');

    wavesurfer = WaveSurfer.create({ container: '#waveform', waveColor: '#7e22ce', progressColor: '#ff8c00', barWidth: 2, height: 100 });

    document.getElementById('audio-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (file) {
            status.innerText = "Loading File...";
            try {
                const url = URL.createObjectURL(file);
                wavesurfer.load(url);
                const arrayBuffer = await file.arrayBuffer();
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                originalBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                playBtn.disabled = aiBtn.disabled = false;
                status.innerText = "Ready to clean! Click 'Apply AI'.";
            } catch (err) {
                status.innerText = "Error: Could not read file. Try a different audio.";
            }
        }
    };

    playBtn.onclick = () => wavesurfer.playPause();

    aiBtn.onclick = async () => {
        status.innerText = "AI is cleaning... please wait.";
        aiBtn.disabled = true;
        try {
            // CDN লিঙ্কটি সরাসরি ব্যবহার করা হচ্ছে
            const rnnoise = await Rnnoise.create({
                locateFile: (path) => `https://cdn.jsdelivr.net/npm/rnnoise-wasm@1.0.2/dist/${path}`
            });

            const inputData = originalBuffer.getChannelData(0);
            const outputData = new Float32Array(inputData.length);

            // ফ্রেম বাই ফ্রেম প্রসেসিং (৪৮০ স্যাম্পল)
            for (let i = 0; i < inputData.length; i += 480) {
                const frame = inputData.slice(i, i + 480);
                if (frame.length === 480) {
                    const cleanFrame = rnnoise.process(frame);
                    outputData.set(cleanFrame, i);
                } else {
                    outputData.set(frame, i);
                }
            }

            const blob = bufferToWave(outputData, originalBuffer.sampleRate);
            currentUrl = URL.createObjectURL(blob);
            wavesurfer.load(currentUrl);
            dlBtn.disabled = false;
            status.innerText = "Success! Noise Removed.";
        } catch (err) {
            console.error(err);
            // আসল এরর মেসেজটি স্ক্রিনে দেখানো হচ্ছে
            status.innerText = "AI Error: " + err.message + ". Try Chrome Incognito mode.";
            aiBtn.disabled = false;
        }
    };

    dlBtn.onclick = () => {
        const a = document.createElement('a'); a.href = currentUrl; a.download = "Cleaned_Audio.wav"; a.click();
    };

    function bufferToWave(data, sampleRate) {
        let length = data.length * 2 + 44, buffer = new ArrayBuffer(length), view = new DataView(buffer), pos = 0;
        const setU32 = (d) => { view.setUint32(pos, d, true); pos += 4; };
        const setU16 = (d) => { view.setUint16(pos, d, true); pos += 2; };
        setU32(0x46464952); setU32(length - 8); setU32(0x45564157); setU32(0x20746d66); setU32(16); setU16(1); setU16(1);
        setU32(sampleRate); setU32(sampleRate * 2); setU16(2); setU16(16); setU32(0x61746164); setU32(data.length * 2);
        for (let i = 0; i < data.length; i++) {
            let s = Math.max(-1, Math.min(1, data[i]));
            view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true); pos += 2;
        }
        return new Blob([buffer], { type: "audio/wav" });
    }
</script>
</body>
</html>
