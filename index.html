<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Pro Editor</title>
    <!-- Background Removal Library -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@latest/dist/bundle.js"></script>
    <style>
        body { margin: 0; background: #0f0f0f; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .editor-box { max-width: 600px; margin: auto; background: #1a1a1a; padding: 20px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        
        /* ক্যানভাস স্টাইল (সিনেমাটিক ফ্রেম) */
        #canvasContainer { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; margin: 20px 0; border: 1px solid #333; }
        canvas { width: 100%; height: 100%; object-fit: contain; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button, input[type="file"] { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        
        .btn-filter { background: #333; color: white; }
        .btn-action { background: #e74c3c; color: white; grid-column: span 2; }
        .btn-download { background: #27ae60; color: white; grid-column: span 2; }
        .loading { display: none; color: #f1c40f; font-size: 14px; margin: 10px 0; }
        
        input[type="file"] { background: #2c3e50; color: white; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="editor-box">
        <h3>Cinematic Pro Editor AI ❤️</h3>
        
        <!-- ছবি আপলোড -->
        <input type="file" id="upload" accept="image/*" onchange="handleImage(event)">
        
        <div id="canvasContainer">
            <canvas id="mainCanvas"></canvas>
        </div>

        <div id="loader" class="loading">AI ব্যাকগ্রাউন্ড রিমুভ করছে... দয়া করে অপেক্ষা করুন (১-২ মিনিট লাগতে পারে)</div>

        <div class="controls">
            <!-- ফিল্টার বাটন -->
            <button class="btn-filter" onclick="applyFilter('none')">Normal</button>
            <button class="btn-filter" onclick="applyFilter('dramatic')">Dramatic</button>
            <button class="btn-filter" onclick="applyFilter('movie')">Movie Style</button>
            <button class="btn-filter" onclick="applyFilter('vintage')">Vintage</button>
            
            <!-- স্পেশাল অ্যাকশন -->
            <button class="btn-action" onclick="removeBackground()">AI ব্যাকগ্রাউন্ড রিমুভ করুন ✨</button>
            <button class="btn-download" onclick="downloadImage()">সিনেমাটিক ফটো ডাউনলোড করুন 📥</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    let originalImage = null;
    let currentFilter = 'none';

    // ১. ছবি লোড করা
    function handleImage(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                originalImage = img;
                render();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    }

    // ২. ক্যানভাস রেন্ডার করা (ফিল্টার ও ব্ল্যাক বারসহ)
    function render() {
        if(!originalImage) return;

        // ক্যানভাস সাইজ সেট করা (সিনেমাটিক ১৬:৯)
        canvas.width = 1920;
        canvas.height = 1080;

        // ব্যাকগ্রাউন্ড কালো করা
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ফিল্টার অ্যাপ্লাই করা
        ctx.filter = getFilterString(currentFilter);

        // ছবি আঁকা (মাঝখানে বসানো)
        const scale = Math.min(canvas.width / originalImage.width, canvas.height / originalImage.height);
        const x = (canvas.width / 2) - (originalImage.width / 2) * scale;
        const y = (canvas.height / 2) - (originalImage.height / 2) * scale;
        ctx.drawImage(originalImage, x, y, originalImage.width * scale, originalImage.height * scale);

        // সিনেমাটিক ব্ল্যাক বার আঁকা (ফিল্টার এর বাইরে রাখার জন্য আবার রিসেট)
        ctx.filter = "none";
        ctx.fillStyle = "black";
        const barHeight = canvas.height * 0.12; // ১২% ব্ল্যাক বার
        ctx.fillRect(0, 0, canvas.width, barHeight); // টপ বার
        ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight); // বটম বার
    }

    function applyFilter(f) {
        currentFilter = f;
        render();
    }

    function getFilterString(f) {
        switch(f) {
            case 'dramatic': return "contrast(1.4) brightness(0.8) saturate(1.2)";
            case 'movie': return "saturate(1.5) contrast(1.2) brightness(0.9) hue-rotate(-10deg)";
            case 'vintage': return "sepia(0.5) contrast(1.1)";
            default: return "none";
        }
    }

    // ৩. AI ব্যাকগ্রাউন্ড রিমুভাল
    async function removeBackground() {
        if(!originalImage) return alert("আগে একটি ছবি আপলোড করুন!");
        
        document.getElementById('loader').style.display = 'block';
        
        try {
            // imgly এআই লাইব্রেরি ব্যবহার করে রিমুভ
            const blob = await imglyRemoveBackground(originalImage.src);
            const url = URL.createObjectURL(blob);
            const newImg = new Image();
            newImg.onload = function() {
                originalImage = newImg;
                render();
                document.getElementById('loader').style.display = 'none';
                alert("ব্যাকগ্রাউন্ড রিমুভ সফল হয়েছে!");
            }
            newImg.src = url;
        } catch (error) {
            console.error(error);
            alert("ব্যাকগ্রাউন্ড রিমুভ করা যায়নি। আপনার ইন্টারনেট চেক করুন।");
            document.getElementById('loader').style.display = 'none';
        }
    }

    // ৪. ছবি ডাউনলোড করা
    function downloadImage() {
        if(!originalImage) return alert("আগে ছবি এডিট করুন!");
        const link = document.createElement('a');
        link.download = 'cinematic_photo.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
