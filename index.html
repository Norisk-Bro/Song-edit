<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Ping Tester Pro</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .box { text-align: center; border: 1px solid #333; padding: 40px; border-radius: 25px; width: 280px; background: #050505; box-shadow: 0 0 40px rgba(255,140,0,0.15); border: 1px solid rgba(255,140,0,0.3); }
        
        .rgb-text { font-size: 14px; font-weight: bold; letter-spacing: 2px; animation: rgb-anim 3s linear infinite; text-transform: uppercase; }
        @keyframes rgb-anim { 
            0%, 100% { color: #ff0000; text-shadow: 0 0 10px #ff0000; } 
            33% { color: #00ff00; text-shadow: 0 0 10px #00ff00; } 
            66% { color: #00d4ff; text-shadow: 0 0 10px #00d4ff; } 
        }

        .ping { font-size: 80px; font-weight: bold; color: #00ff00; margin: 15px 0; line-height: 1; transition: 0.3s; }
        .unit { font-size: 20px; color: #ff8c00; font-weight: bold; }
        
        button { background: #ff8c00; border: none; padding: 15px; border-radius: 12px; color: #000; font-weight: bold; cursor: pointer; width: 100%; margin-top: 25px; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 15px rgba(255,140,0,0.3); }
        button:hover { background: #e67e00; }
        button:active { transform: scale(0.95); }

        #status { margin-top: 20px; font-size: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="box">
    <div class="rgb-text">FREE FIRE GAMING PING</div>
    <div class="ping" id="pDisplay">--</div>
    <span class="unit">ms</span>
    <button id="startBtn">TEST REAL PING</button>
    <div id="status">READY</div>
</div>
