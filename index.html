<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গোপন মেসেজ বক্স</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Hind+Siliguri:wght@500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 450px; text-align: center; }
        
        textarea, input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; outline: none; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 5px; }

        #linkArea { display: none; margin-top: 15px; background: #f8f9fa; padding: 15px; border-radius: 10px; border: 1px dashed #007bff; }
        #finalURL { word-break: break-all; font-size: 12px; color: #333; display: block; margin-bottom: 10px; }

        #msgContainer { display: none; margin-top: 25px; padding: 20px; background: #fff; border: 2px solid #ff4d6d; border-radius: 15px; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.2); animation: openCard 0.8s ease-out; }
        #msgText { font-size: 22px; color: #d81b60; font-family: 'Dancing Script', 'Hind Siliguri', cursive; word-wrap: break-word; }

        @keyframes openCard { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .hidden { display: none; }
        .loading { font-size: 12px; color: #007bff; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <!-- মেসেজ তৈরি -->
        <div id="createMode">
            <h3>গোপন মেসেজ তৈরি করুন 🔒</h3>
            <textarea id="text" rows="3" placeholder="এখানে মেসেজ লিখুন..."></textarea>
            <input type="password" id="pass" placeholder="পাসওয়ার্ড সেট করুন">
            <button id="mainBtn" onclick="makeLink()">লিঙ্ক তৈরি করুন</button>
            
            <div id="linkArea">
                <span id="finalURL"></span>
                <div id="loader" class="loading">লিঙ্ক ছোট করা হচ্ছে...</div>
                <button id="shortBtn" onclick="getShortLink()" style="background: #6f42c1;">লিঙ্কটি ছোট করুন (Shorten)</button>
                <button onclick="copyURL()" style="background: #28a745; margin-top: 5px;">কপি করুন</button>
            </div>
        </div>

        <!-- মেসেজ দেখা -->
        <div id="viewMode" class="hidden">
            <h3>মেসেজটি লক করা আছে 🔑</h3>
            <input type="password" id="checkPass" placeholder="পাসওয়ার্ড লিখুন">
            <button onclick="decrypt()">আনলক করুন</button>
            <div id="msgContainer"><span id="msgText"></span></div>
        </div>
    </div>

<script>
    const params = new URLSearchParams(window.location.search);
    const data = params.get('d');
    const hash = params.get('k');

    if(data && hash) {
        document.getElementById('createMode').classList.add('hidden');
        document.getElementById('viewMode').classList.remove('hidden');
    }

    let longURL = "";

    function makeLink() {
        const txt = document.getElementById('text').value;
        const ps = document.getElementById('pass').value;
        if(!txt || !ps) return alert("মেসেজ ও পাসওয়ার্ড দিন");

        const encMsg = btoa(encodeURIComponent(txt));
        const encPass = btoa(ps);
        
        longURL = window.location.href.split('?')[0] + `?d=${encMsg}&k=${encPass}`;

        document.getElementById('finalURL').innerText = longURL;
        document.getElementById('linkArea').style.display = 'block';
        document.getElementById('shortBtn').style.display = 'block';
    }

    // Short Link তৈরির ফাংশন (is.gd API ব্যবহার করে)
    async function getShortLink() {
        const shortBtn = document.getElementById('shortBtn');
        const loader = document.getElementById('loader');
        
        shortBtn.style.display = "none";
        loader.style.display = "block";

        // Browser থেকে সরাসরি API কল করার জন্য CORS Proxy ব্যবহার করা হয়েছে
        const apiUrl = `https://is.gd/create.php?format=simple&url=${encodeURIComponent(longURL)}`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;

        try {
            const response = await fetch(proxyUrl);
            const result = await response.json();
            const shortLink = result.contents;

            if (shortLink && shortLink.includes("is.gd")) {
                document.getElementById('finalURL').innerText = shortLink;
                loader.style.display = "none";
                alert("লিঙ্কটি ছোট করা হয়েছে!");
            } else {
                throw new Error();
            }
        } catch (error) {
            alert("লিঙ্ক ছোট করা যায়নি। বড় লিঙ্কটিই ব্যবহার করুন।");
            loader.style.display = "none";
            shortBtn.style.display = "block";
        }
    }

    function decrypt() {
        const input = document.getElementById('checkPass').value;
        if(input === atob(hash)) {
            const decoded = decodeURIComponent(atob(data));
            const container = document.getElementById('msgContainer');
            const textElement = document.getElementById('msgText');
            container.style.display = "block";
            textElement.innerText = "";
            let i = 0;
            function typeWriter() {
                if (i < decoded.length) {
                    textElement.innerHTML += decoded.charAt(i); i++;
                    setTimeout(typeWriter, 50);
                }
            }
            typeWriter();
        } else {
            alert("ভুল পাসওয়ার্ড!");
        }
    }

    function copyURL() {
        const text = document.getElementById('finalURL').innerText;
        navigator.clipboard.writeText(text).then(() => alert("কপি হয়েছে!"));
    }
</script>

</body>
</html>
