<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাগল তোর জন্যরে ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Hind Siliguri', sans-serif; background: #050505; color: white; overflow-x: hidden; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* স্টার্ট স্ক্রিন */
        #start-screen { text-align: center; z-index: 1000; position: fixed; }
        .open-btn { padding: 18px 40px; background: #ff4d6d; color: white; border: none; border-radius: 50px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 0 25px #ff4d6d; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        /* মেইন কন্টেন্ট */
        #content { display: none; text-align: center; width: 95%; max-width: 500px; padding: 20px; }
        
        /* লিরিক্স বক্স ডিজাইন */
        .lyrics-card {
            background: rgba(255, 77, 109, 0.05);
            border: 1px solid rgba(255, 77, 109, 0.3);
            padding: 25px 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-size: 19px;
            line-height: 1.8;
            color: #ffb3c1;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.4);
            animation: slideUp 1.5s ease-out;
        }

        /* ব্যক্তিগত মেসেজ (Default Font) */
        .final-msg { animation: fadeIn 3s ease-in; margin-top: 20px; }
        .msg-text { 
            font-size: 28px; 
            color: #ff4d6d; 
            font-family: 'Hind Siliguri', sans-serif; /* ডিফল্ট সুন্দর ফন্ট */
            font-weight: 700;
            text-shadow: 0 0 5px rgba(255, 77, 109, 0.3);
            margin-top: 10px;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .heart { position: fixed; color: #ff4d6d; animation: float 4s infinite linear; opacity: 0; pointer-events: none; }
        @keyframes float { 0% { transform: translateY(100vh) scale(0.5); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.2); opacity: 0; } }

        /* ক্রিয়েটর ফরম */
        #creator { background: #111; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #333; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; outline: none; background: #222; color: #fff; font-family: inherit; }
        .btn { width: 100%; padding: 12px; background: #ff4d6d; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #link-show { background: #222; padding: 10px; border-radius: 8px; margin-top: 15px; word-break: break-all; font-size: 11px; display: none; border: 1px dashed #ff4d6d; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="creator">
        <h3 style="color: #ff4d6d; margin-bottom: 15px;">Surprise Card Creator ❤️</h3>
        <input type="text" id="targetName" placeholder="কার জন্য? (নাম)">
        <textarea id="secretMsg" rows="3" placeholder="আপনার মেসেজ..."></textarea>
        <button class="btn" onclick="generateLink()">লিঙ্ক তৈরি করুন</button>
        <div id="link-show">
            <p id="finalURL" style="color: #ccc; margin-bottom: 10px;"></p>
            <button class="btn" style="background: #28a745;" onclick="copyURL()">লিঙ্ক কপি করুন</button>
        </div>
    </div>

    <div id="start-screen" style="display: none;">
        <button class="open-btn" onclick="openSurprise()">ওপেন করো পাগলু! 🎁</button>
    </div>

    <div id="content">
        <div class="lyrics-card">
            <p>পাগল তোর জন্যরে.পাগল এ মন পাগল।</p>
            <p>পাগল তোর জন্যরে.পাগল এ মন পাগল।</p>
            <br>
            <p>মুখে বলি দূরে যা.মন বলে থেকে যা</p>
            <p>মুখে বলি দূরে যা.মন বলে থেকে যা</p>
            <p>দূরে গেলে মন বোঝে.তুই কত আপন।।</p>
            <br>
            <p>পাগল তোর জন্যরে.পাগল এ মন পাগল।</p>
            <p>পাগল তোর জন্যরে.পাগল এ মন পাগল।</p>
        </div>

        <div class="final-msg">
            <h1 style="font-size: 30px; margin-bottom: 5px;">Hello <span id="friendName" style="color:#ff4d6d;"></span>!</h1>
            <div class="msg-text" id="showMsg"></div>
        </div>
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const d = urlParams.get('n');
    const m = urlParams.get('m');

    if(d && m) {
        document.getElementById('creator').style.display = 'none';
        document.getElementById('start-screen').style.display = 'block';
    }

    function openSurprise() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        const music = document.getElementById('bgMusic');
        music.play();
        document.getElementById('friendName').innerText = decodeURIComponent(atob(d));
        document.getElementById('showMsg').innerText = decodeURIComponent(atob(m));
        setInterval(createHeart, 300);
    }

    function generateLink() {
        const name = document.getElementById('targetName').value;
        const msg = document.getElementById('secretMsg').value;
        if(!name || !msg) return alert("দয়া করে নাম এবং মেসেজ দিন!");
        const link = window.location.href.split('?')[0] + `?n=${btoa(encodeURIComponent(name))}&m=${btoa(encodeURIComponent(msg))}`;
        document.getElementById('finalURL').innerText = link;
        document.getElementById('link-show').style.display = 'block';
    }

    function copyURL() {
        navigator.clipboard.writeText(document.getElementById('finalURL').innerText);
        alert("লিঙ্ক কপি হয়েছে!");
    }

    function createHeart() {
        const h = document.createElement('div');
        h.className = 'heart'; h.innerHTML = '❤️';
        h.style.left = Math.random() * 100 + 'vw';
        h.style.fontSize = Math.random() * 20 + 20 + 'px';
        h.style.animationDuration = Math.random() * 2 + 3 + 's';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 4000);
    }
</script>
</body>
</html>
